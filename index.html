<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercices orthophonie — IME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;color:#1a1a18;min-height:100vh;padding:24px 16px 40px;}
.container{max-width:500px;margin:0 auto;}
.screen{display:none;}
.screen.active{display:block;}
.loading{text-align:center;padding:40px 0;font-size:14px;color:#9b9b96;}

/* PROFILS */
.page-title{font-size:20px;font-weight:600;margin-bottom:4px;}
.page-sub{font-size:13px;color:#6b6b66;margin-bottom:20px;}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
.p-card{background:#fff;border:1.5px solid #e0dfd8;border-radius:14px;padding:16px;cursor:pointer;transition:border-color 0.15s;}
.p-card:hover{border-color:#1D9E75;}
.p-card-name{font-size:15px;font-weight:600;margin-bottom:4px;}
.p-card-streak{font-size:11px;color:#1D9E75;margin-top:6px;font-weight:600;}
.add-btn{display:flex;align-items:center;gap:8px;font-size:14px;color:#6b6b66;background:#fff;border:1.5px dashed #d0cfc8;border-radius:14px;padding:16px;cursor:pointer;width:100%;margin-top:4px;}
.add-btn:hover{border-color:#1D9E75;color:#1D9E75;}
.ortho-link{display:block;text-align:center;margin-top:20px;font-size:12px;color:#9b9b96;cursor:pointer;background:none;border:none;width:100%;}
.ortho-link:hover{color:#6b6b66;}

/* HEADER COMMUN */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-header h2{font-size:18px;font-weight:600;}
.back-btn{font-size:12px;color:#6b6b66;background:#fff;border:1px solid #e0dfd8;border-radius:8px;padding:5px 12px;cursor:pointer;}
.back-btn:hover{background:#f0efe8;}

/* EXERCICES PATIENT */
.timer-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.timer-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;}
.timer-btn{font-size:12px;font-weight:500;padding:5px 14px;cursor:pointer;border:1px solid #d0cfc8;border-radius:8px;background:#f5f4f0;}
.timer-btn:hover{background:#e8e7e2;}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:#e0dfd8;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width 0.3s;}
.prog-lbl{font-size:12px;color:#6b6b66;min-width:32px;text-align:right;font-weight:600;}
.exo-list{display:flex;flex-direction:column;gap:10px;}
.exo{background:#fff;border:1.5px solid #e0dfd8;border-radius:14px;overflow:hidden;transition:border-color 0.15s,background 0.15s;}
.exo.done{border-color:#1D9E75;background:#f0fbf6;}
.exo-top-row{display:flex;align-items:stretch;}
.exo-acc{width:5px;flex-shrink:0;}
.exo-main{flex:1;padding:12px 14px 8px;}
.exo-img{width:100%;max-height:160px;object-fit:cover;border-bottom:1px solid #e0dfd8;display:block;}
.exo-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.exo-nm{font-size:14px;font-weight:600;line-height:1.3;}
.exo.done .exo-nm{color:#085041;}
.exo-dose{font-size:11px;font-weight:600;color:#6b6b66;background:#f0efe8;border-radius:6px;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
.exo.done .exo-dose{background:#9FE1CB;color:#085041;}
.exo-how{font-size:12px;color:#6b6b66;line-height:1.4;}
.exo.done .exo-how{color:#0F6E56;}
.exo-why{font-size:11px;color:#9b9b96;margin-top:4px;font-style:italic;}
.exo.done .exo-why{color:#5DCAA5;}
.reps-section{padding:10px 14px 14px;}
.reps-label{font-size:11px;color:#9b9b96;margin-bottom:8px;}
.sound-group{display:flex;flex-direction:column;gap:10px;}
.sound-row-label{font-size:12px;font-weight:600;color:#6b6b66;margin-bottom:6px;}
.exo.done .sound-row-label{color:#0F6E56;}
.circles{display:flex;gap:6px;flex-wrap:wrap;}
.rep-dot{width:28px;height:28px;border-radius:50%;border:2px solid #d0cfc8;background:#f5f4f0;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
.rep-dot.filled{background:#1D9E75;border-color:#1D9E75;}
.rep-dot:hover{border-color:#1D9E75;}
.foot-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.reset-btn{font-size:12px;color:#9b9b96;background:none;border:none;cursor:pointer;}
.reset-btn:hover{color:#6b6b66;}
.suivi-btn{font-size:12px;font-weight:600;color:#185FA5;background:#E6F1FB;border:none;border-radius:8px;padding:5px 14px;cursor:pointer;}
.suivi-btn:hover{background:#cce0f5;}

/* LECTURE */
.lect-progress{display:flex;gap:6px;margin-bottom:20px;justify-content:center;}
.lect-dot{width:10px;height:10px;border-radius:50%;background:#e0dfd8;transition:background 0.2s;}
.lect-dot.ok{background:#1D9E75;}
.lect-dot.err{background:#E24B4A;}
.lect-dot.cur{background:#378ADD;}
.lect-card{background:#fff;border:1.5px solid #e0dfd8;border-radius:16px;overflow:hidden;}
.lect-mot{font-size:48px;font-weight:700;text-align:center;padding:32px 20px 24px;color:#1a1a18;letter-spacing:1px;}
.lect-img-wrap{display:none;text-align:center;padding:0 20px 20px;}
.lect-img-wrap img{max-height:180px;max-width:100%;border-radius:10px;}
.lect-img-wrap .lect-mot-sous{font-size:22px;font-weight:600;color:#1a1a18;margin-top:12px;}
.lect-btn-compris{width:100%;font-size:15px;font-weight:600;color:#fff;background:#378ADD;border:none;border-radius:0 0 14px 14px;padding:16px;cursor:pointer;}
.lect-btn-compris:hover{background:#185FA5;}
.lect-btns-eval{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid #e0dfd8;display:none;}
.lect-btn-ok{font-size:14px;font-weight:600;color:#fff;background:#1D9E75;border:none;border-radius:0 0 0 14px;padding:16px;cursor:pointer;}
.lect-btn-ok:hover{background:#0F6E56;}
.lect-btn-err{font-size:14px;font-weight:600;color:#fff;background:#E24B4A;border:none;border-radius:0 0 14px 0;padding:16px;cursor:pointer;}
.lect-btn-err:hover{background:#A32D2D;}
.lect-score-final{text-align:center;padding:32px 20px;}
.lect-score-num{font-size:48px;font-weight:700;color:#1D9E75;}
.lect-score-label{font-size:15px;color:#6b6b66;margin-top:8px;}
.lect-btn-retour{margin-top:20px;font-size:14px;font-weight:600;color:#fff;background:#1D9E75;border:none;border-radius:10px;padding:12px 28px;cursor:pointer;}

/* BRAVO */
#bravo{display:none;position:fixed;inset:0;background:#1D9E75;z-index:99;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;}
#bravo.show{display:flex;}
.bravo-emoji{font-size:64px;margin-bottom:20px;animation:pop 0.4s ease;}
.bravo-t{font-size:28px;font-weight:700;color:#fff;margin-bottom:10px;animation:rise 0.4s ease 0.1s both;}
.bravo-s{font-size:15px;color:#B8EDD8;line-height:1.6;margin-bottom:32px;animation:rise 0.4s ease 0.2s both;}
.bravo-back{font-size:13px;color:#B8EDD8;background:none;border:1.5px solid #B8EDD8;border-radius:10px;padding:10px 24px;cursor:pointer;animation:rise 0.4s ease 0.3s both;}
.bravo-back:hover{background:#fff;color:#085041;}
@keyframes pop{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
@keyframes rise{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* SUIVI */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;}
.stat-box{background:#fff;border:1px solid #e0dfd8;border-radius:12px;padding:12px;text-align:center;}
.stat-n{font-size:22px;font-weight:700;color:#1D9E75;}
.stat-l{font-size:11px;color:#9b9b96;margin-top:2px;line-height:1.3;}
.month-blk{margin-bottom:24px;}
.month-t{font-size:12px;font-weight:600;color:#6b6b66;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-lbl{font-size:11px;color:#9b9b96;text-align:center;padding-bottom:3px;}
.cal-d{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.cal-d.empty{background:transparent;}
.cal-d.future{background:#f0efe8;color:#c0bfb8;}
.cal-d.missed{background:#fee8e8;color:#c0392b;}
.cal-d.ok{background:#1D9E75;color:#fff;}
.cal-d.today{outline:2px solid #1D9E75;outline-offset:-2px;}
.empty-state{text-align:center;color:#9b9b96;font-size:13px;padding:32px 0;line-height:1.6;}

/* LOGIN */
.login-box{max-width:320px;margin:60px auto 0;background:#fff;border:1px solid #e0dfd8;border-radius:16px;padding:32px;}
.login-box h2{font-size:18px;font-weight:600;margin-bottom:4px;}
.login-box p{font-size:13px;color:#6b6b66;margin-bottom:20px;}
.login-box input{width:100%;font-size:14px;padding:9px 12px;border:1px solid #d0cfc8;border-radius:8px;margin-bottom:12px;outline:none;}
.login-box input:focus{border-color:#1D9E75;}
.login-box button{width:100%;font-size:14px;font-weight:600;color:#fff;background:#1D9E75;border:none;border-radius:8px;padding:10px;cursor:pointer;}
.login-box button:hover{background:#0F6E56;}
.login-err{font-size:12px;color:#c0392b;margin-top:8px;display:none;}

/* VUE ORTHO — LISTE PATIENTS */
.patient-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0dfd8;border-radius:12px;padding:14px 16px;margin-bottom:8px;}
.patient-row-name{font-size:15px;font-weight:600;}
.patient-row-info{font-size:12px;color:#6b6b66;margin-top:2px;}
.patient-row-link{font-size:11px;color:#185FA5;margin-top:4px;cursor:pointer;}
.patient-row-link:hover{text-decoration:underline;}
.patient-row-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-sm{font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;border:1px solid #d0cfc8;background:#f5f4f0;color:#1a1a18;white-space:nowrap;}
.btn-sm:hover{background:#e8e7e2;}
.btn-sm.danger{border-color:#f5c4b3;background:#faece7;color:#993c1d;}
.btn-sm.danger:hover{background:#f5c4b3;}
.btn-sm.primary{background:#1D9E75;border-color:#1D9E75;color:#fff;}
.btn-sm.primary:hover{background:#0F6E56;}

/* ÉDITEUR EXERCICES */
.exo-editor{background:#fff;border:1px solid #e0dfd8;border-radius:14px;padding:16px;margin-bottom:12px;}
.exo-editor-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.exo-editor-num{font-size:13px;font-weight:600;color:#6b6b66;}
.field-row{margin-bottom:10px;}
.field-row label{font-size:11px;color:#9b9b96;display:block;margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
.field-row input,.field-row textarea,.field-row select{width:100%;font-size:13px;padding:7px 10px;border:1px solid #d0cfc8;border-radius:8px;outline:none;font-family:inherit;background:#fff;}
.field-row input:focus,.field-row textarea:focus,.field-row select:focus{border-color:#1D9E75;}
.field-row textarea{resize:vertical;min-height:50px;}
.field-row-inline{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color 0.15s;}
.color-dot.selected{border-color:#1a1a18;}
.img-preview{width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:6px;display:none;}
.img-upload-btn{font-size:12px;color:#185FA5;background:#E6F1FB;border:none;border-radius:7px;padding:5px 12px;cursor:pointer;margin-top:4px;}
.img-upload-btn:hover{background:#cce0f5;}
.img-remove-btn{font-size:12px;color:#993c1d;background:#faece7;border:none;border-radius:7px;padding:5px 12px;cursor:pointer;margin-top:4px;margin-left:6px;display:none;}
.sounds-editor{margin-top:8px;display:none;}
.sound-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.sound-item input{flex:1;font-size:13px;padding:6px 10px;border:1px solid #d0cfc8;border-radius:7px;outline:none;}
.sound-item input:focus{border-color:#1D9E75;}
.sound-item .reps-input{width:60px;flex:none;}
.sound-remove{font-size:11px;color:#993c1d;background:none;border:none;cursor:pointer;padding:0 4px;}
.add-sound-btn{font-size:12px;color:#6b6b66;background:none;border:1px dashed #d0cfc8;border-radius:7px;padding:5px 12px;cursor:pointer;margin-top:4px;}
.add-sound-btn:hover{border-color:#1D9E75;color:#1D9E75;}
.add-exo-btn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:#6b6b66;background:#fff;border:1.5px dashed #d0cfc8;border-radius:14px;padding:14px;cursor:pointer;width:100%;margin-bottom:16px;}
.add-exo-btn:hover{border-color:#1D9E75;color:#1D9E75;}
.save-bar{position:sticky;bottom:0;background:#f5f4f0;padding:12px 0;margin-top:8px;}
.save-bar button{width:100%;font-size:14px;font-weight:600;color:#fff;background:#1D9E75;border:none;border-radius:10px;padding:12px;cursor:pointer;}
.save-bar button:hover{background:#0F6E56;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:50;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:14px;border:1px solid #e0dfd8;padding:24px;width:min(340px,90vw);}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px;}
.modal label{font-size:13px;color:#6b6b66;display:block;margin-bottom:4px;}
.modal input{width:100%;font-size:14px;padding:8px 10px;border:1px solid #d0cfc8;border-radius:8px;margin-bottom:14px;outline:none;}
.modal input:focus{border-color:#1D9E75;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.modal-btns button{font-size:13px;padding:7px 18px;border-radius:8px;cursor:pointer;border:1px solid #d0cfc8;background:#f5f4f0;color:#1a1a18;}
.modal-btns .primary{background:#1D9E75;border-color:#1D9E75;color:#fff;}
.modal-btns .primary:hover{background:#0F6E56;}
</style>

<div class="container">

<!-- PROFILS -->
<div id="s-profiles" class="screen active">
  <div style="padding:1rem 0 2rem;">
    <div class="page-title">Exercices orthophonie</div>
    <div class="page-sub">Qui fait ses exercices aujourd'hui ?</div>
    <div id="profile-loading" class="loading">Chargement...</div>
    <div class="p-grid" id="profile-grid" style="display:none;"></div>
    <button class="add-btn" id="add-patient-btn" onclick="openAddModal()" style="display:none;">+ Ajouter un jeune</button>
    <button class="ortho-link" onclick="showLogin()">Accès orthophoniste</button>
  </div>
</div>

<!-- EXERCICES PATIENT -->
<div id="s-exos" class="screen">
  <div style="padding:1rem 0 2rem;">
    <div class="page-header">
      <h2 id="ex-name"></h2>
      <button class="back-btn" onclick="goProfiles()">← Retour</button>
    </div>
    <div class="timer-row">
      <span class="timer-val" id="tval">5:00</span>
      <button class="timer-btn" id="tbtn" onclick="toggleTimer()">Démarrer</button>
    </div>
    <div class="prog-row">
      <div class="prog-track"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
      <div class="prog-lbl" id="plbl">0/0</div>
    </div>
    <div class="exo-list" id="exo-list"></div>
    <div class="foot-row">
      <button class="reset-btn" onclick="resetDay()" id="btn-reset" style="display:none">↺ Réinitialiser</button>
      <button class="suivi-btn" onclick="showLecture()" id="btn-lecture" style="display:none">📖 Lecture</button>
      <button class="suivi-btn" onclick="showSuivi()" id="btn-suivi">📅 Suivi</button>
    </div>
  </div>
</div>

<!-- SUIVI -->
<div id="s-suivi" class="screen">
  <div style="padding:1rem 0 2rem;">
    <div class="page-header">
      <h2 id="suivi-name"></h2>
      <button class="back-btn" id="suivi-back">← Retour</button>
    </div>
    <div class="stats-row" id="stats-row"></div>
    <div id="cal-content"></div>
  </div>
</div>

<!-- LOGIN -->
<div id="s-login" class="screen">
  <div class="login-box">
    <h2>Espace orthophoniste</h2>
    <p>Accès réservé</p>
    <input type="password" id="pwd-input" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')checkLogin();" />
    <button onclick="checkLogin()">Connexion</button>
    <div class="login-err" id="login-err">Mot de passe incorrect</div>
  </div>
</div>

<!-- VUE ORTHO -->
<div id="s-ortho" class="screen">
  <div style="padding:1rem 0 2rem;">
    <div class="page-header">
      <h2>Patients</h2>
      <button class="back-btn" onclick="logoutOrtho()">Déconnexion</button>
    </div>
    <div id="ortho-loading" class="loading">Chargement...</div>
    <div id="ortho-patients"></div>
    <button class="add-btn" id="ortho-add-btn" onclick="openAddModal()" style="display:none;margin-top:8px;">+ Nouveau patient</button>
  </div>
</div>

<!-- ÉDITEUR EXERCICES -->
<div id="s-edit" class="screen">
  <div style="padding:1rem 0 2rem;">
    <div class="page-header">
      <h2 id="edit-title">Programme</h2>
      <button class="back-btn" onclick="show('s-ortho');loadOrtho();">← Retour</button>
    </div>
    <div id="edit-exos-list"></div>
    <button class="add-exo-btn" onclick="addExoEditor()">+ Ajouter un exercice</button>
    <div class="save-bar"><button onclick="saveAllExos()">Enregistrer le programme</button></div>
  </div>
</div>

</div>

<!-- LECTURE : VUE PATIENT -->
<div id="s-lecture" class="screen">
  <div style="padding:1rem 0 2rem;">
    <div class="page-header">
      <h2 id="lect-name"></h2>
      <button class="back-btn" onclick="goExos()">← Retour</button>
    </div>
    <div class="lect-progress" id="lect-progress"></div>
    <div id="lect-card"></div>
  </div>
</div>

<!-- LECTURE : VUE ORTHO CONFIG -->
<div id="s-lecture-config" class="screen">
  <div style="padding:1rem 0 2rem;">
    <div class="page-header">
      <h2 id="lect-config-title">Lecture</h2>
      <button class="back-btn" onclick="show('s-ortho');loadOrtho();">← Retour</button>
    </div>
    <div class="field-row">
      <label style="font-size:11px;color:#9b9b96;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">Mots par jour</label>
      <input type="number" id="lect-nb" min="1" max="20" value="5" style="width:80px;font-size:14px;padding:7px 10px;border:1px solid #d0cfc8;border-radius:8px;outline:none;" />
    </div>
    <div class="field-row" style="margin-top:12px;">
      <label style="font-size:11px;color:#9b9b96;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">Liste de mots (un mot par ligne)</label>
      <textarea id="lect-mots" style="width:100%;min-height:200px;font-size:14px;padding:10px;border:1px solid #d0cfc8;border-radius:8px;outline:none;font-family:inherit;margin-top:4px;line-height:1.8;" placeholder="bateau
gâteau
chapeau
manteau
panneau
..."></textarea>
    </div>
    <div class="save-bar"><button onclick="saveLectureConfig()">Enregistrer la liste</button></div>
  </div>
</div>

<!-- BRAVO -->
<div id="bravo">
  <div class="bravo-emoji">🏆</div>
  <div class="bravo-t" id="bravo-t"></div>
  <div class="bravo-s">Programme du jour terminé<br>Reviens demain !</div>
  <button class="bravo-back" onclick="hideBravo()">Retour</button>
</div>

<!-- MODAL AJOUT PATIENT -->
<div class="modal-bg" id="add-modal">
  <div class="modal">
    <h3>Nouveau patient</h3>
    <label>Prénom</label>
    <input type="text" id="new-name" placeholder="Ex : Laouni" maxlength="30" onkeydown="if(event.key==='Enter')createPatient();" />
    <div class="modal-btns">
      <button onclick="closeAddModal()">Annuler</button>
      <button class="primary" onclick="createPatient()">Créer</button>
    </div>
  </div>
</div>

<script>
var SB_URL='https://hvltfhnliwjqpyuxrheh.supabase.co';

var ORTHO_PWD='ortho2024';
var COLORS=['#5DCAA5','#7F77DD','#378ADD','#D85A30','#E0A020','#D4537E','#639922','#888780'];

function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function sb(path,opts){
  var res=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'}
  },opts||{}));
  if(!res.ok){console.error(await res.text());return null;}
  var t=await res.text();return t?JSON.parse(t):[];
}

async function sbUpload(file,path){
  var res=await fetch(SB_URL+'/storage/v1/object/exercice-images/'+path,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':file.type,'x-upsert':'true'},
    body:file
  });
  if(!res.ok){console.error(await res.text());return null;}
  return SB_URL+'/storage/v1/object/public/exercice-images/'+path;
}

var ST={pid:null,pname:'',exos:[],days:[],reps:{},timer:300,timerOn:false,timerInt:null,editPid:null,editPname:'',editExos:[]};

function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}

/* ── PROFILS ── */
async function loadProfiles(){
  show('s-profiles');
  document.getElementById('profile-loading').style.display='block';
  document.getElementById('profile-grid').style.display='none';
  document.getElementById('add-patient-btn').style.display='none';
  var patients=await sb('patients?select=id,name&order=created_at');
  if(!patients){document.getElementById('profile-loading').textContent='Erreur de connexion.';return;}
  var html='';
  for(var i=0;i<patients.length;i++){
    var p=patients[i];
    var days=await sb('suivi?patient_id=eq.'+p.id+'&select=date');
    var dlist=days?days.map(function(d){return d.date;}):[];
    var streak=calcStreak(dlist);
    html+='<div class="p-card" onclick="selectPatient(\''+p.id+'\',\''+esc(p.name)+'\')">';
    html+='<div class="p-card-name">'+esc(p.name)+'</div>';
    if(dlist.length>0)html+='<div class="p-card-streak">🔥 '+streak+' j. · '+dlist.length+' total</div>';
    html+='</div>';
  }
  document.getElementById('profile-loading').style.display='none';
  document.getElementById('profile-grid').innerHTML=html;
  document.getElementById('profile-grid').style.display='grid';
  document.getElementById('add-patient-btn').style.display='flex';
}

async function selectPatient(pid,pname){
  ST.pid=pid;ST.pname=pname;ST.reps={};resetTimer();
  document.getElementById('ex-name').textContent=pname;
  document.getElementById('bravo-t').textContent='Bravo '+pname+' !';
  show('s-exos');
  document.getElementById('exo-list').innerHTML='<div class="loading">Chargement...</div>';
  var exos=await sb('exercices?patient_id=eq.'+pid+'&order=position');
  ST.exos=exos||[];
  var days=await sb('suivi?patient_id=eq.'+pid+'&select=date');
  ST.days=days?days.map(function(d){return d.date;}):[];
  var listes=await sb('lecture_listes?patient_id=eq.'+pid+'&select=id,mots');
  ST.hasLecture=listes&&listes.length>0&&listes[0].mots&&listes[0].mots.length>0;

  if(ST.hasLecture&&(!ST.exos||ST.exos.length===0)){
    showLecture();return;
  }

}

function goProfiles(){clearTimer();ST.reps={};loadProfiles();}

/* ── EXERCICES ── */
function isExoDone(exo){
  if(exo.type==='reps')return (ST.reps[exo.id]||0)>=(exo.reps||10);
  if(exo.type==='sounds')return (exo.sounds||[]).every(function(s,si){return (ST.reps[exo.id+'_'+si]||0)>=s.reps;});
  return false;
}

function buildCircles(key,total,color){
  var filled=ST.reps[key]||0,html='<div class="circles" id="c_'+key+'">';
  for(var i=0;i<total;i++){
    var f=i<filled;
    html+='<div class="rep-dot'+(f?' filled':'')+'" style="'+(f?'background:'+color+';border-color:'+color+';':'')+'" onclick="dotClick(\''+key+'\','+i+','+total+',\''+color+'\')"></div>';
  }
  return html+'</div>';
}

function buildExos(){
  var html='';
  ST.exos.forEach(function(exo){
    var done=isExoDone(exo);
    html+='<div class="exo'+(done?' done':'')+'" id="exo_'+exo.id+'">';
    if(exo.image_url){html+='<img class="exo-img" src="'+esc(exo.image_url)+'" alt="" />';}
    html+='<div class="exo-top-row"><div class="exo-acc" style="background:'+esc(exo.color)+'"></div>';
    html+='<div class="exo-main"><div class="exo-title-row"><span class="exo-nm">'+esc(exo.name)+'</span><span class="exo-dose">'+esc(exo.dose)+'</span></div>';
    html+='<div class="exo-how">'+esc(exo.how)+'</div><div class="exo-why">'+esc(exo.why)+'</div></div></div>';
    html+='<div class="reps-section">';
    if(exo.type==='reps'){
      html+='<div class="reps-label">Coche chaque répétition</div>'+buildCircles(exo.id,exo.reps||10,exo.color);
    } else if(exo.type==='sounds'){
      html+='<div class="sound-group">';
      (exo.sounds||[]).forEach(function(s,si){
        html+='<div><div class="sound-row-label">'+esc(s.label)+'</div>'+buildCircles(exo.id+'_'+si,s.reps,exo.color)+'</div>';
      });
      html+='</div>';
    }
    html+='</div></div>';
  });
  document.getElementById('exo-list').innerHTML=html||'';
  // Boutons conditionnels
  var hasExos=ST.exos&&ST.exos.length>0;
  document.getElementById('btn-reset').style.display=hasExos?'block':'none';
  document.getElementById('btn-lecture').style.display=ST.hasLecture?'inline-block':'none';
  updateProg();
}

function dotClick(key,idx,total,color){
  var cur=ST.reps[key]||0;
  ST.reps[key]=(idx===cur-1)?cur-1:idx+1;
  var c=document.getElementById('c_'+key);
  if(c){var f=ST.reps[key];c.querySelectorAll('.rep-dot').forEach(function(d,i){if(i<f){d.classList.add('filled');d.style.background=color;d.style.borderColor=color;}else{d.classList.remove('filled');d.style.background='';d.style.borderColor='';}});}
  ST.exos.forEach(function(exo){var el=document.getElementById('exo_'+exo.id);if(el){if(isExoDone(exo))el.classList.add('done');else el.classList.remove('done');}});
  updateProg();
  if(ST.exos.length&&ST.exos.every(function(e){return isExoDone(e);}))setTimeout(showBravo,400);
}

function updateProg(){
  var done=ST.exos.filter(function(e){return isExoDone(e);}).length,total=ST.exos.length;
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('plbl').textContent=done+'/'+total;
}

async function showBravo(){
  var today=todayStr();
  if(ST.days.indexOf(today)<0){await sb('suivi',{method:'POST',body:JSON.stringify({patient_id:ST.pid,date:today})});ST.days.push(today);}
  document.getElementById('bravo').classList.add('show');clearTimer();
}
function hideBravo(){document.getElementById('bravo').classList.remove('show');ST.reps={};resetTimer();buildExos();}
function resetDay(){ST.reps={};resetTimer();buildExos();}

/* ── SUIVI ── */
function showSuivi(fromOrtho,pid,pname,days){
  if(fromOrtho){ST.pid=pid;ST.pname=pname;ST.days=days;}
  document.getElementById('suivi-name').textContent='Suivi — '+ST.pname;
  document.getElementById('suivi-back').onclick=fromOrtho?function(){show('s-ortho');}:function(){show('s-exos');};
  buildSuivi();show('s-suivi');
}

function buildSuivi(){
  var days=ST.days,today=todayStr(),streak=calcStreak(days);
  var thisMonth=days.filter(function(d){return d.slice(0,7)===today.slice(0,7);}).length;
  document.getElementById('stats-row').innerHTML=
    '<div class="stat-box"><div class="stat-n">'+days.length+'</div><div class="stat-l">jours au total</div></div>'+
    '<div class="stat-box"><div class="stat-n">'+thisMonth+'</div><div class="stat-l">ce mois-ci</div></div>'+
    '<div class="stat-box"><div class="stat-n">'+streak+'</div><div class="stat-l">jours de suite</div></div>';
  if(!days.length){document.getElementById('cal-content').innerHTML='<div class="empty-state">Aucun jour enregistré.</div>';return;}
  var sorted=days.slice().sort(),first=new Date(sorted[0]+'T00:00:00'),todayDate=new Date(today+'T00:00:00');
  var html='',cursor=new Date(first.getFullYear(),first.getMonth(),1);
  while(cursor<=todayDate){html+=buildMonthCal(cursor,days,todayDate);cursor.setMonth(cursor.getMonth()+1);}
  document.getElementById('cal-content').innerHTML=html;
}

function buildMonthCal(date,doneDays,todayDate){
  var months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var y=date.getFullYear(),m=date.getMonth();
  var html='<div class="month-blk"><div class="month-t">'+months[m]+' '+y+'</div><div class="cal-grid">';
  ['L','M','M','J','V','S','D'].forEach(function(l){html+='<div class="cal-lbl">'+l+'</div>';});
  var first=new Date(y,m,1).getDay(),off=(first===0)?6:first-1;
  for(var i=0;i<off;i++)html+='<div class="cal-d empty"></div>';
  var dim=new Date(y,m+1,0).getDate(),ts=todayDate.getFullYear()+'-'+pad(todayDate.getMonth()+1)+'-'+pad(todayDate.getDate());
  for(var dd=1;dd<=dim;dd++){
    var ds=y+'-'+pad(m+1)+'-'+pad(dd),cell=new Date(y,m,dd),cls='cal-d';
    if(cell>todayDate)cls+=' future';else if(doneDays.indexOf(ds)>=0)cls+=' ok';else cls+=' missed';
    if(ds===ts)cls+=' today';
    html+='<div class="'+cls+'">'+dd+'</div>';
  }
  return html+'</div></div>';
}

function calcStreak(days){
  if(!days||!days.length)return 0;
  var sorted=days.slice().sort().reverse(),streak=0,cursor=new Date(todayStr()+'T00:00:00');
  for(var i=0;i<365;i++){
    var s=cursor.getFullYear()+'-'+pad(cursor.getMonth()+1)+'-'+pad(cursor.getDate());
    if(sorted.indexOf(s)>=0){streak++;cursor.setDate(cursor.getDate()-1);}else break;
  }
  return streak;
}

/* ── TIMER ── */
function toggleTimer(){
  if(ST.timerOn){clearInterval(ST.timerInt);ST.timerOn=false;document.getElementById('tbtn').textContent='Reprendre';}
  else{
    if(ST.timer<=0){ST.timer=300;updateTimerDisplay();}
    ST.timerOn=true;document.getElementById('tbtn').textContent='Pause';
    ST.timerInt=setInterval(function(){ST.timer--;updateTimerDisplay();if(ST.timer<=0){clearInterval(ST.timerInt);ST.timerOn=false;document.getElementById('tbtn').textContent='Terminé !';document.getElementById('tval').textContent='0:00';}},1000);
  }
}
function clearTimer(){clearInterval(ST.timerInt);ST.timerOn=false;}
function resetTimer(){clearTimer();ST.timer=300;updateTimerDisplay();document.getElementById('tbtn').textContent='Démarrer';}
function updateTimerDisplay(){var m=Math.floor(ST.timer/60),s=ST.timer%60;document.getElementById('tval').textContent=m+':'+pad(s);}

/* ── ÉDITEUR EXERCICES ── */
async function openEditor(pid,pname){
  ST.editPid=pid;ST.editPname=pname;
  document.getElementById('edit-title').textContent=pname;
  show('s-edit');
  document.getElementById('edit-exos-list').innerHTML='<div class="loading">Chargement...</div>';
  var exos=await sb('exercices?patient_id=eq.'+pid+'&order=position');
  ST.editExos=(exos||[]).map(function(e){return Object.assign({},e,{_tmpImg:null});});
  renderEditors();
}

function renderEditors(){
  var html='';
  ST.editExos.forEach(function(exo,i){renderEditor(exo,i,function(h){html+=h;});});
  document.getElementById('edit-exos-list').innerHTML=html;
  // Attacher les handlers d'upload image
  ST.editExos.forEach(function(exo,i){
    var inp=document.getElementById('img-input-'+i);
    if(inp)inp.addEventListener('change',function(e){handleImgUpload(e,i);});
  });
}

function renderEditor(exo,i,cb){
  var sounds=exo.sounds||[];
  var isSound=exo.type==='sounds';
  var colorDots=COLORS.map(function(c){return '<div class="color-dot'+(exo.color===c?' selected':'')+'" style="background:'+c+'" onclick="setColor('+i+',\''+c+'\')"></div>';}).join('');
  var soundsHtml='';
  sounds.forEach(function(s,si){
    soundsHtml+='<div class="sound-item" id="si_'+i+'_'+si+'">';
    soundsHtml+='<input type="text" placeholder="Nom du son (ex: Chhhh)" value="'+esc(s.label||'')+'" id="slabel_'+i+'_'+si+'" />';
    soundsHtml+='<input type="number" class="reps-input" min="1" max="20" value="'+(s.reps||5)+'" id="sreps_'+i+'_'+si+'" placeholder="rép." />';
    soundsHtml+='<button class="sound-remove" onclick="removeSound('+i+','+si+')">✕</button>';
    soundsHtml+='</div>';
  });
  var imgUrl=exo.image_url||'';
  var html='<div class="exo-editor" id="editor_'+i+'">';
  html+='<div class="exo-editor-header"><span class="exo-editor-num">Exercice '+(i+1)+'</span>';
  html+='<button class="btn-sm danger" onclick="removeExo('+i+')">Supprimer</button></div>';
  html+='<div class="field-row"><label>Nom</label><input type="text" id="ename_'+i+'" value="'+esc(exo.name||'')+'" placeholder="Ex : Langue ventouse" /></div>';
  html+='<div class="field-row-inline">';
  html+='<div class="field-row" style="margin:0"><label>Dose</label><input type="text" id="edose_'+i+'" value="'+esc(exo.dose||'')+'" placeholder="Ex : 10 fois" /></div>';
  html+='<div class="field-row" style="margin:0"><label>Type</label><select id="etype_'+i+'" onchange="toggleType('+i+')">';
  html+='<option value="reps"'+(isSound?'':' selected')+'>Répétitions</option>';
  html+='<option value="sounds"'+(isSound?' selected':'')+'>Sons groupés</option>';
  html+='</select></div></div>';
  html+='<div class="field-row" id="reps-field-'+i+'" style="'+(isSound?'display:none':'')+'">';
  html+='<label>Nombre de cercles</label><input type="number" id="ereps_'+i+'" min="1" max="20" value="'+(exo.reps||10)+'" /></div>';
  html+='<div class="sounds-editor" id="sounds-editor-'+i+'" style="'+(isSound?'display:block':'')+'">';
  html+=soundsHtml;
  html+='<button class="add-sound-btn" onclick="addSound('+i+')">+ Ajouter un son</button></div>';
  html+='<div class="field-row"><label>Comment faire (consigne)</label><textarea id="ehow_'+i+'">'+esc(exo.how||'')+'</textarea></div>';
  html+='<div class="field-row"><label>Pourquoi (bénéfice)</label><textarea id="ewhy_'+i+'">'+esc(exo.why||'')+'</textarea></div>';
  html+='<div class="field-row"><label>Couleur</label><div class="color-row" id="color-row-'+i+'">'+colorDots+'</div></div>';
  html+='<div class="field-row"><label>Image</label>';
  html+='<input type="file" accept="image/*" id="img-input-'+i+'" style="display:none" />';
  html+='<button class="img-upload-btn" onclick="document.getElementById(\'img-input-'+i+'\').click()">📷 Choisir une image</button>';
  html+='<button class="img-remove-btn" id="img-remove-'+i+'" onclick="removeImg('+i+')"'+(imgUrl?' style="display:inline-block"':'')+'>Supprimer l\'image</button>';
  html+='<img class="img-preview" id="img-preview-'+i+'" src="'+esc(imgUrl)+'" '+(imgUrl?'style="display:block"':'')+' /></div>';
  html+='</div>';
  cb(html);
}

function setColor(i,color){
  ST.editExos[i].color=color;
  document.getElementById('color-row-'+i).querySelectorAll('.color-dot').forEach(function(d,ci){
    d.classList.toggle('selected',d.style.background===color||COLORS[ci]===color);
  });
}

function toggleType(i){
  var val=document.getElementById('etype_'+i).value;
  ST.editExos[i].type=val;
  document.getElementById('reps-field-'+i).style.display=val==='sounds'?'none':'';
  document.getElementById('sounds-editor-'+i).style.display=val==='sounds'?'block':'none';
}

function addSound(i){
  if(!ST.editExos[i].sounds)ST.editExos[i].sounds=[];
  ST.editExos[i].sounds.push({label:'',reps:5});
  var si=ST.editExos[i].sounds.length-1;
  var container=document.getElementById('sounds-editor-'+i);
  var div=document.createElement('div');
  div.className='sound-item';div.id='si_'+i+'_'+si;
  div.innerHTML='<input type="text" placeholder="Nom du son" id="slabel_'+i+'_'+si+'" /><input type="number" class="reps-input" min="1" max="20" value="5" id="sreps_'+i+'_'+si+'" /><button class="sound-remove" onclick="removeSound('+i+','+si+')">✕</button>';
  container.insertBefore(div,container.lastElementChild);
}

function removeSound(i,si){
  var el=document.getElementById('si_'+i+'_'+si);
  if(el)el.remove();
}

function removeExo(i){
  if(!confirm('Supprimer cet exercice ?'))return;
  ST.editExos.splice(i,1);renderEditors();
}

function addExoEditor(){
  ST.editExos.push({id:'new_'+Date.now(),name:'',dose:'',how:'',why:'',color:COLORS[0],type:'reps',reps:10,sounds:[],image_url:'',_tmpImg:null,patient_id:ST.editPid,position:ST.editExos.length,_new:true});
  renderEditors();
  // Scroll vers le bas
  setTimeout(function(){window.scrollTo(0,document.body.scrollHeight);},100);
}

function handleImgUpload(e,i){
  var file=e.target.files[0];if(!file)return;
  ST.editExos[i]._tmpImg=file;
  var reader=new FileReader();
  reader.onload=function(ev){
    var preview=document.getElementById('img-preview-'+i);
    var removeBtn=document.getElementById('img-remove-'+i);
    if(preview){preview.src=ev.target.result;preview.style.display='block';}
    if(removeBtn)removeBtn.style.display='inline-block';
  };
  reader.readAsDataURL(file);
}

function removeImg(i){
  ST.editExos[i].image_url='';ST.editExos[i]._tmpImg=null;
  var preview=document.getElementById('img-preview-'+i);
  var removeBtn=document.getElementById('img-remove-'+i);
  if(preview){preview.src='';preview.style.display='none';}
  if(removeBtn)removeBtn.style.display='none';
}

function collectExoData(i){
  var exo=ST.editExos[i];
  var type=document.getElementById('etype_'+i).value;
  var sounds=[];
  if(type==='sounds'){
    var si=0;
    while(document.getElementById('slabel_'+i+'_'+si)){
      var lbl=document.getElementById('slabel_'+i+'_'+si).value.trim();
      var rps=parseInt(document.getElementById('sreps_'+i+'_'+si).value)||5;
      if(lbl)sounds.push({label:lbl,reps:rps});
      si++;
    }
  }
  return {
    name:document.getElementById('ename_'+i).value.trim(),
    dose:document.getElementById('edose_'+i).value.trim(),
    how:document.getElementById('ehow_'+i).value.trim(),
    why:document.getElementById('ewhy_'+i).value.trim(),
    color:exo.color||COLORS[0],
    type:type,
    reps:parseInt(document.getElementById('ereps_'+i).value)||10,
    sounds:sounds,
    position:i,
    image_url:exo.image_url||''
  };
}

async function saveAllExos(){
  var btn=document.querySelector('.save-bar button');
  btn.textContent='Enregistrement...';btn.disabled=true;
  for(var i=0;i<ST.editExos.length;i++){
    var exo=ST.editExos[i];
    var data=collectExoData(i);
    // Upload image si nouvelle
    if(exo._tmpImg){
      var path=ST.editPid+'/exo_'+i+'_'+Date.now();
      var url=await sbUpload(exo._tmpImg,path);
      if(url)data.image_url=url;
    }
    if(!data.name)continue;
    if(exo._new){
      data.patient_id=ST.editPid;
      await sb('exercices',{method:'POST',body:JSON.stringify(data)});
    } else {
      await sb('exercices?id=eq.'+exo.id,{method:'PATCH',body:JSON.stringify(data)});
    }
  }
  btn.textContent='Enregistrer le programme';btn.disabled=false;
  alert('Programme enregistré !');

}

/* ── LECTURE ── */
var LECT={pid:null,pname:'',mots:[],motsDuJour:[],idx:0,scores:[],imgVisible:false};

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

async function showLecture(){
  if(!ST.pid)return;
  LECT.pid=ST.pid;LECT.pname=ST.pname;
  show('s-lecture');
  document.getElementById('lect-name').textContent=ST.pname+' — Lecture';
  document.getElementById('lect-card').innerHTML='<div class="loading">Chargement...</div>';
  // Charger la liste
  var liste=await sb('lecture_listes?patient_id=eq.'+ST.pid);
  if(!liste||!liste.length||!liste[0].mots||!liste[0].mots.length){
    document.getElementById('lect-card').innerHTML='<div class="empty-state">Aucune liste de mots configurée.<br>Demande à ton orthophoniste !</div>';
    return;
  }
  var cfg=liste[0];
  var nb=cfg.mots_par_jour||5;
  var tousLesMots=cfg.mots.filter(function(m){return m.trim();});
  // Vérifier si session du jour existe déjà
  var today=todayStr();
  var sessions=await sb('lecture_sessions?patient_id=eq.'+ST.pid+'&date_session=eq.'+today);
  if(sessions&&sessions.length>0&&sessions[0].completed){
    // Session déjà complète aujourd'hui — afficher score
    var s=sessions[0];
    var sc=s.scores||[];
    var bons=sc.filter(function(x){return x==='ok';}).length;
    showScoreFinal(bons,sc.length,true);
    return;
  }
  if(sessions&&sessions.length>0&&!sessions[0].completed){
    // Session en cours — reprendre
    LECT.motsDuJour=sessions[0].mots;
    LECT.scores=sessions[0].scores||[];
    LECT.sessionId=sessions[0].id;
  } else {
    // Nouvelle session
    LECT.motsDuJour=shuffle(tousLesMots).slice(0,nb);
    LECT.scores=[];
    var res=await sb('lecture_sessions',{method:'POST',body:JSON.stringify({patient_id:ST.pid,date_session:today,mots:LECT.motsDuJour,scores:[]})});
    LECT.sessionId=res&&res[0]?res[0].id:null;
  }
  LECT.idx=LECT.scores.length;
  if(LECT.idx>=LECT.motsDuJour.length){
    var bons=LECT.scores.filter(function(x){return x==='ok';}).length;
    showScoreFinal(bons,LECT.scores.length,false);
    return;
  }
  buildLectCard();
}

function buildLectProgress(){
  var html='<div class="lect-progress">';
  LECT.motsDuJour.forEach(function(m,i){
    var cls='lect-dot';
    if(i<LECT.scores.length)cls+=' '+(LECT.scores[i]==='ok'?'ok':'err');
    else if(i===LECT.idx)cls+=' cur';
    html+='<div class="'+cls+'"></div>';
  });
  html+='</div>';
  document.getElementById('lect-progress').innerHTML=html;
}

function buildLectCard(){
  buildLectProgress();
  var mot=LECT.motsDuJour[LECT.idx];
  var html='<div class="lect-card">';
  html+='<div class="lect-mot">'+esc(mot)+'</div>';
  html+='<div class="lect-btns-eval" style="display:grid">';
  html+='<button class="lect-btn-ok" onclick="evaluer(\'ok\')">✓ Compris</button>';
  html+='<button class="lect-btn-err" onclick="evaluer(\'err\')">✗ Pas compris</button>';
  html+='</div>';
  html+='</div>';
  document.getElementById('lect-card').innerHTML=html;
}

async function evaluer(score){
  LECT.scores.push(score);
  // Sauvegarder dans Supabase
  var completed=LECT.scores.length>=LECT.motsDuJour.length;
  if(LECT.sessionId){
    await sb('lecture_sessions?id=eq.'+LECT.sessionId,{method:'PATCH',body:JSON.stringify({scores:LECT.scores,completed:completed})});
  }
  LECT.idx++;
  if(completed){
    var bons=LECT.scores.filter(function(x){return x==='ok';}).length;
    showScoreFinal(bons,LECT.scores.length,false);
  } else {
    buildLectCard();
  }
}

function showScoreFinal(bons,total,dejaFait){
  buildLectProgress();
  var html='<div class="lect-card"><div class="lect-score-final">';
  html+='<div style="font-size:40px;margin-bottom:12px;">'+(bons===total?'🌟':'👍')+'</div>';
  html+='<div class="lect-score-num">'+bons+' / '+total+'</div>';
  html+='<div class="lect-score-label">'+(dejaFait?'Déjà fait aujourd\'hui !':'mots lus correctement')+'</div>';
  html+='<button class="lect-btn-retour" onclick="goExos()">Retour aux exercices</button>';
  html+='</div></div>';
  document.getElementById('lect-card').innerHTML=html;
}

function getArasaacUrl(mot){
  // API ARASAAC recherche par mot
  var m=encodeURIComponent(mot.toLowerCase().trim());
  return 'https://api.arasaac.org/v1/pictograms/fr/search/'+m+'?download=false';
}

/* ── ARASAAC : chercher le vrai picto ── */
async function fetchArasaacPicto(mot){
  try{
    var res=await fetch('https://api.arasaac.org/v1/pictograms/fr/search/'+encodeURIComponent(mot.toLowerCase().trim()));
    if(!res.ok)return null;
    var data=await res.json();
    if(data&&data.length>0){return 'https://api.arasaac.org/v1/pictograms/'+data[0]._id+'?download=false';}
  }catch(e){}
  return null;
}

// Surcharge buildLectCard pour charger le vrai picto
var _buildLectCard=buildLectCard;
buildLectCard=async function(){
  _buildLectCard();
  var mot=LECT.motsDuJour[LECT.idx];
  var url=await fetchArasaacPicto(mot);
  var imgWrap=document.getElementById('lect-img-wrap');
  if(imgWrap&&url){
    var img=imgWrap.querySelector('img');
    if(img)img.src=url;
  }
};
